# Abuse limits for the live counter, keyed by client IP. Behind a load balancer or CDN,
# every request arrives from the proxy's IP, so set set_real_ip_from and real_ip_header
# for that proxy, or these limits will throttle all visitors together.
limit_conn_zone $binary_remote_addr zone=presence_conn:10m;
limit_req_zone $binary_remote_addr zone=presence_req:10m rate=60r/m;

upstream next_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Goes through to Next.js, so it fails if either process is unhealthy.
    location = /healthz {
        access_log off;
        proxy_pass http://next_app/;
    }

    # Server-Sent Events: nginx must not buffer or compress the stream.
    location = /api/presence {
        access_log off;

        # Each stream stays open, so cap how many one IP can hold and how fast it can
        # open them. A normal visitor has one per visible tab and reconnects rarely.
        # The burst allows for a shared office or school IP.
        limit_conn presence_conn 20;
        limit_req zone=presence_req burst=30 nodelay;
        limit_conn_status 429;
        limit_req_status 429;

        proxy_pass http://next_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }

    # File names contain a content hash, so they can be cached forever.
    location /_next/static/ {
        access_log off;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri @next;
    }

    location @next {
        proxy_pass http://next_app;
    }
}
