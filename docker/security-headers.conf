# Included in every location that sets its own add_header, because nginx only
# inherits add_header into locations that set none of their own.
#
# Pages are prerendered at build time, so they can't carry per-request nonces, and
# Next.js needs 'unsafe-inline' for its inline scripts. HSTS and
# upgrade-insecure-requests belong to whatever terminates HTTPS in front of this container.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Frame-Options "DENY" always;
